; ================================================================
;  PlatformIO – Smart Plant Micro-Macro Nutrient Doser
;  Target Board : Espressif ESP32 Dev Module
;  Framework    : Arduino
;  Simulator    : Wokwi VS Code Extension
; ================================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ── Serial monitor ──────────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = direct

; ── Required Libraries ──────────────────────────────────────────
;   OneWire          – 1-Wire bus protocol (DS18B20 communication)
;   DallasTemperature– High-level DS18B20 sensor driver
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

; ── Build flags ─────────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; ── Partition scheme (default is fine for this project) ─────────
board_build.partitions = default.csv

; ── Upload settings (not used in Wokwi – simulator reads .elf) ──
upload_protocol = esptool
